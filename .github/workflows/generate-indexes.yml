name: Generate Indexes (Internal)

# Runs only on reviewed code. Proposed PR code never executes in a job that holds
# the bot token, the GPG signing key or an OIDC identity; index updates arrive as a
# bot PR into develop instead of a commit pushed onto the contributor's PR branch.
on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'indexes/**'

permissions:
  contents: read

concurrency:
  group: generate-indexes
  cancel-in-progress: true

jobs:
  generate-indexes:
    runs-on: ubuntu-latest
    if: github.repository == 'panther-labs/panther-analysis'
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: repo
    env:
      INDEX_BRANCH: auto-update-indexes
    steps:
      - name: Checkout token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          path: bootstrap
          sparse-checkout: .github/actions/github-automation-token
          persist-credentials: false
      - name: Request GitHub automation token
        id: github-automation
        uses: ./bootstrap/.github/actions/github-automation-token
        with:
          token_url: ${{ secrets.APP_TOKEN_SERVICE_URL }}
          permissions: '{"contents":"write","pull_requests":"write"}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          path: repo
          # App token (not GITHUB_TOKEN) so pushes to the bot branch trigger PR checks.
          token: ${{ steps.github-automation.outputs.token }}
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip3 install -r ./.scripts/requirements.txt
      - name: Generate indexes
        run: python3 ./.scripts/generate_indexes.py
      - name: Check for changes
        id: check-for-changes
        run: |
          if [ -n "$(git status --porcelain -- ./indexes)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No index changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import GPG key
        if: steps.check-for-changes.outputs.has_changes == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd #v7.0.0
        with:
          gpg_private_key: ${{ secrets.PANTHER_BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PANTHER_BOT_GPG_PRIVATE_KEY_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          workdir: repo
      - name: Commit indexes
        if: steps.check-for-changes.outputs.has_changes == 'true'
        run: |
          git config --global user.email "github-service-account-automation@panther.io"
          git config --global user.name "panther-bot-automation"
          git switch -C "$INDEX_BRANCH"
          git add ./indexes
          git commit -S -m "Update indexes"
          # One rolling bot branch: each develop push replaces the previous pending update.
          git push --force origin "$INDEX_BRANCH"
      # peter-evans/create-pull-request was not working with git signing, so using gh cli instead
      - name: Open or update pull request
        if: steps.check-for-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.github-automation.outputs.token }}
        run: |
          if [ -z "$(gh pr list --head "$INDEX_BRANCH" --base develop --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "$INDEX_BRANCH" \
              --base develop \
              --title "Update indexes" \
              --body 'This PR was automatically generated by the [generate-indexes workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).'
          fi
