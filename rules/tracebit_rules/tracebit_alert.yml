AnalysisType: rule
Filename: tracebit_alert.py
RuleID: "Tracebit.Alert"
DisplayName: "Tracebit Alert"
Enabled: true
LogTypes:
    - Tracebit.Alert
Severity: Medium
Description: |-
    Tracebit maintains security canaries across your organization to detect potential intrusions.

    This alert indicates that Tracebit has detected activity on security canaries.
DedupPeriodMinutes: 1440
Threshold: 1
Tests:
    - Name: AWS Canary Accessed
      ExpectedResult: true
      Log:
        alert_id: 00000000-0000-0000-0000-000000000001
        canary:
            aws:
                account_id: "123456789012"
                account_name: example-prod
                arn: arn:aws:s3:::example-quarterly-monitor
            name: example-quarterly-monitor
            provider_account_id: "123456789012"
            provider_id: arn:aws:s3:::example-quarterly-monitor
            tracebit_id: 00000000-0000-0000-0000-000000000003
            type: AWS::S3::Bucket
        discriminator:
            subtype: canary_resource_accessed
            type: tracebit_alert_log
        event:
            id: 00000000-0000-0000-0000-000000000002
            operation: ListObjects
            request:
                ip: 203.0.113.10
                user_agent:
                    label: AWS Console
                    raw: '[S3Console/0.4, aws-internal/3 aws-sdk-java/1.12.750 Linux/5.10.223-190.873.amzn2int.x86_64 OpenJDK_64-Bit_Server_VM/25.412-b09 java/1.8.0_412 vendor/Oracle_Corporation cfg/retry-mode/standard]'
            resources:
                - id: example-quarterly-monitor
                  type: AWS::S3::Bucket
                - id: example-quarterly-monitor/backup/
                  type: AWS::S3::Object
        id: 00000000-0000-0000-0000-000000000002
        message: Canary resource activity detected in AWS
        principal:
            aws:
                account_id: "123456789012"
                arn: arn:aws:sts::123456789012:assumed-role/AWSReservedSSO_Admin_EXAMPLE/jane.doe@example.com
                type: AssumedRole
            id: AWSReservedSSO_Admin_EXAMPLE/jane.doe@example.com
        provider: aws
        severity: Medium
        timestamp: "2024-09-04T08:06:28Z"
        tracebit_portal_url: https://example.tracebit.com/alerts/00000000-0000-0000-0000-000000000001
    - Name: AWS Canary Credential Used
      ExpectedResult: true
      Log:
        alert_id: 00000000-0000-0000-0000-000000000005
        canary_credential:
            aws:
                access_key_id: ASIA_EXAMPLE_0024
            expires_at: "2024-09-05T03:08:17Z"
            issued_at: "2024-09-03T15:08:17.513903Z"
