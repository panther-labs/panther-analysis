  - Name: 403 Response (Excluded)
    ExpectedResult: false
    Log:
      {
        "kind": "Event",
        "verb": "get",
        "user": {"username": "system:serviceaccount:default:test"},
        "sourceIPs": ["1.0.0.1"],
        "objectRef": {"resource": "secrets"},
        "responseStatus": {"code": 403},
        "stage": "ResponseComplete",
        "p_log_type": "Amazon.EKS.Audit"
      }
