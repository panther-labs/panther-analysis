AnalysisType: rule
Description: Dropbox item shared externally
DisplayName: "Dropbox External Share"
Enabled: true
Filename: dropbox_external_share.py
Reference: https://help.dropbox.com/share/share-outside-dropbox
Severity: Low
Tests:
  - ExpectedResult: true
    Log:
      actor:
        _tag: user
        user:
          _tag: team_member
          account_id: dbid:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          display_name: Alice Bob
          email: jane.doe@example.com
          team_member_id: dbmid:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB
      assets:
        - .tag: file
          display_name: paper1.paper
          file_id: id:lUP4ZxMYmc4AAAAAAAAAaA
          path:
            contextual: /pathtest/paper1.paper
            namespace_relative:
              is_shared_namespace: true
              ns_id: "3590048721"
              relative_path: /paper1.paper
      context:
        _tag: team_member
        account_id: dbid:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        display_name: Alice Bob
        email: jane.doe@example.com
        team_member_id: dbmid:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB
      details:
        .tag: shared_content_add_member_details
        shared_content_access_level:
          .tag: viewer
      event_category:
        _tag: sharing
      event_type:
        _tag: shared_content_add_member
        description: Added users and/or groups to shared file/folder
      involve_non_team_member: true
      origin:
        access_method:
          .tag: end_user
          end_user:
            .tag: web
            session_id: dbwsid:EXAMPLE-SESSION-ID
        geo_location:
          city: Anytown
          country: US
          ip_address: 203.0.113.10
          region: Example Region
      p_any_emails:
        - john.doe@example.org
        - jane.doe@example.com
      p_any_ip_addresses:
        - 203.0.113.10
      p_any_usernames:
        - Alice Bob
        - john doe
      p_event_time: "2023-04-18 22:31:03"
      p_log_type: Dropbox.TeamEvent
      p_parse_time: "2023-04-18 22:32:46.967"
      p_row_id: 00000000000000000000000000000001
      p_schema_version: 0
      p_source_id: 00000000-0000-0000-0000-000000100001
      p_source_label: dropbox1
      participants:
        - user:
            _tag: non_team_member
            account_id: dbid:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAC
            display_name: john doe
            email: john.doe@example.org
      timestamp: "2023-04-18 22:31:03"
    Name: external share
DedupPeriodMinutes: 60
LogTypes:
  - Dropbox.TeamEvent
RuleID: "Dropbox.External.Share"
Threshold: 1
