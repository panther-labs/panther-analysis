AnalysisType: rule
DisplayName: "DNS Base64 Encoded Query"
Description: Detects DNS queries with Base64 encoded subdomains, which could indicate an attempt to obfuscate data exfil.
RuleID: "Standard.DNSBase64"
Enabled: false
Filename: standard_dns_base64.py
Reference: https://zofixer.com/what-is-base64-disclosure-vulnerability/
Severity: Medium
DedupPeriodMinutes: 60
Threshold: 1
LogTypes:
  - Crowdstrike.FDREvent
  - AWS.VPCDns
  - CiscoUmbrella.DNS
Tests:
  - Name: AWS VPC DNS (Positive)
    ExpectedResult: true
    Log:
      {
        "account_id": "123456789012",
        "answers": [{ "Class": "IN", "Rdata": "172.31.46.187", "Type": "A" }],
        "p_log_type": "AWS.VPCDns",
        "query_class": "IN",
        "query_name": "c29tZSBsb25nIGJhc2U2NCBzdHJpbmc=.file1.16s.us",
        "query_timestamp": "2023-04-11 01:29:20",
        "query_type": "A",
        "rcode": "NOERROR",
        "region": "us-west-2",
        "srcaddr": "172.31.46.187",
        "srcids": { "instance": "i-0123456789abcdef0" },
        "srcport": "36899",
        "transport": "UDP",
        "version": "1.100000",
        "vpc_id": "vpc-00000000",
      }
  - Name: AWS VPS DNS (Negative)
    ExpectedResult: false
    Log:
      {
        "account_id": "123456789012",
        "answers": [{ "Class": "IN", "Rdata": "172.31.46.187", "Type": "A" }],
        "p_log_type": "AWS.VPCDns",
        "query_class": "IN",
        "query_name": "test.com",
        "query_timestamp": "2023-04-11 01:29:20",
        "query_type": "A",
        "rcode": "NOERROR",
        "region": "us-west-2",
        "srcaddr": "172.31.46.187",
        "srcids": { "instance": "i-0123456789abcdef0" },
        "srcport": "36899",
        "transport": "UDP",
        "version": "1.100000",
        "vpc_id": "vpc-00000000",
      }
  - Name: AWS VPS DNS subdomain (Negative)
    ExpectedResult: false
    Log:
      {
        "account_id": "123456789012",
        "answers": [{ "Class": "IN", "Rdata": "172.31.46.187", "Type": "A" }],
        "p_log_type": "AWS.VPCDns",
        "query_class": "IN",
        "query_name": "=.test.com",
        "query_timestamp": "2023-04-11 01:29:20",
        "query_type": "A",
        "rcode": "NOERROR",
        "region": "us-west-2",
        "srcaddr": "172.31.46.187",
        "srcids": { "instance": "i-0123456789abcdef0" },
        "srcport": "36899",
        "transport": "UDP",
        "version": "1.100000",
        "vpc_id": "vpc-00000000",
      }
