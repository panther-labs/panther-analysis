AnalysisType: rule
Filename: notion_page_accessible_to_guests.py
RuleID: "Notion.PagePerms.GuestPermsChanged"
DisplayName: "Notion Page Guest Permissions Changed"
Enabled: true
LogTypes:
  - Notion.AuditLogs
Tags:
  - Notion
  - Data Security
  - Information Disclosure
Severity: Low
Description: The external guest permissions for a Notion page have been altered.
DedupPeriodMinutes: 60
Threshold: 1
Runbook: Potential information exposure - review the shared page and rectify if needed.
Reference: https://www.notion.so/help/sharing-and-permissions
Tests:
  - Name: Guest Role Added
    ExpectedResult: true
    Log:
      {
        "event":
          {
            "actor":
              {
                "id": "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx",
                "object": "user",
                "person": { "email": "aragorn.elessar@example.net" },
                "type": "person",
              },
            "details":
              {
                "entity":
                  {
                    "id": "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx",
                    "object": "user",
                    "person": { "email": "frodo.baggins@example.net" },
                    "type": "person",
                  },
                "new_permission": "full_access",
                "old_permission": "none",
                "page_audience": "shared_internally",
                "target":
                  {
                    "page_id": "00000000-0000-0000-0000-00000000002a",
                    "type": "page_id",
                  },
              },
            "id": "00000000-0000-0000-0000-00000000006d",
            "timestamp": "2023-08-11 23:02:53.113000000",
            "type": "page.permissions.guest_role_added",
            "workspace_id": "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx",
          },
      }

  - Name: Guest Role Changed
    ExpectedResult: true
    Log:
      {
        "event":
          {
            "actor":
              {
                "id": "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx",
                "object": "user",
                "person": { "email": "aragorn.elessar@example.net" },
                "type": "person",
              },
            "details":
              {
                "entity":
                  {
                    "id": "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx",
                    "object": "user",
                    "person": { "email": "frodo.baggins@example.net" },
                    "type": "person",
                  },
                "new_permission": "full_access",
                "old_permission": "read_only",
                "page_audience": "shared_internally",
                "target":
                  {
                    "page_id": "00000000-0000-0000-0000-00000000002a",
                    "type": "page_id",
                  },
              },
            "id": "00000000-0000-0000-0000-00000000006d",
            "timestamp": "2023-08-11 23:02:53.113000000",
            "type": "page.permissions.guest_role_updated",
            "workspace_id": "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx",
          },
      }
