    ExpectedResult: true
    Log:
      {
        "content":
          {
            "origin": "github",
            "target":
              {
                "branch": "some-branch",
                "id": 222222222,
                "name": "repo-name",
                "owner": "github-org",
              },
            "targetFile": "go.mod",
            "type": "gomodules",
          },
        "created": "2023-03-30 15:38:18.58",
        "event": "org.project.stop_monitor",
        "groupId": "00000000-0000-0000-0000-000000000048",
        "orgId": "00000000-0000-0000-0000-00000000001b",
        "projectId": "00000000-0000-0000-0000-000000000012",
        "userId": "05555555-3333-4ddd-8ccc-75555555555",
      }
  - Name: Project Ignore Create
    ExpectedResult: true
    Log:
      {
        "content":
