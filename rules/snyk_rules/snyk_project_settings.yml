        "groupId": "00000000-0000-0000-0000-000000000048",
      }
  - Name: Snyk Org Project Edit
    ExpectedResult: false
    Log:
      {
        "content": {
          "snapshotId": "00000000-0000-0000-0000-00000000003c"
        },
        "created": "2024-09-02 23:49:37.552000000",
