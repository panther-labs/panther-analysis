AnalysisType: rule
Filename: teleport_network_scanning.py
RuleID: "Teleport.NetworkScanning"
DisplayName: "Teleport Network Scan Initiated"
Enabled: true
LogTypes:
  - Gravitational.TeleportAudit
Tags:
  - SSH
  - Discovery:Network Service Discovery
Severity: Medium
Description: A user has invoked a network scan that could potentially indicate enumeration of the network.
DedupPeriodMinutes: 60
Reports:
  MITRE ATT&CK:
    - TA0007:T1046
Reference: https://goteleport.com/docs/management/admin/
Runbook: >
  Find related commands within the time window and determine if the command was invoked legitimately. Examine the arguments to determine how the command was used.
SummaryAttributes:
  - event
  - code
  - user
  - program
  - path
  - return_code
  - login
  - server_id
  - sid
Tests:
  - Name: Echo command
    ExpectedResult: false
    Log:
      {
        "argv": [],
        "cgroup_id": 4294967537,
        "code": "T4000I",
        "ei": 15,
        "event": "session.command",
        "login": "root",
        "namespace": "default",
        "path": "/bin/echo",
        "pid": 7143,
        "ppid": 7115,
        "program": "echo",
        "return_code": 0,
        "server_id": "00000000-0000-0000-0000-000000100002",
        "sid": "00000000-0000-0000-0000-000000100003",
        "time": "2020-08-17T17:40:37.491Z",
        "uid": "00000000-0000-0000-0000-000000100004",
        "user": "panther",
      }
  - Name: Nmap with no args
    ExpectedResult: false
    Log:
      {
        "argv": [],
        "cgroup_id": 4294967672,
        "code": "T4000I",
        "ei": 16,
        "event": "session.command",
        "login": "root",
        "namespace": "default",
        "path": "/bin/nmap",
        "pid": 13555,
        "ppid": 13525,
        "program": "nmap",
        "return_code": 0,
        "server_id": "00000000-0000-0000-0000-000000100002",
        "sid": "00000000-0000-0000-0000-000000100008",
        "time": "2020-08-17T21:13:47.117Z",
        "uid": "00000000-0000-0000-0000-000000100009",
        "user": "panther",
      }
  - Name: Nmap with args
    ExpectedResult: true
    Log:
      {
        "argv": ["-v", "-iR", "100000", "-Pn", "-p", "80"],
        "cgroup_id": 4294967672,
        "code": "T4000I",
        "ei": 16,
        "event": "session.command",
        "login": "root",
        "namespace": "default",
        "path": "/bin/nmap",
        "pid": 13555,
        "ppid": 13525,
        "program": "nmap",
        "return_code": 0,
        "server_id": "00000000-0000-0000-0000-000000100002",
        "sid": "00000000-0000-0000-0000-000000100008",
        "time": "2020-08-17T21:13:47.117Z",
        "uid": "00000000-0000-0000-0000-000000100009",
        "user": "panther",
      }
  - Name: Nmap running from crontab
    ExpectedResult: true
    Log:
      {
        "cgroup_id": 4294967792,
        "code": "T4002I",
        "dst_addr": "999.999.999.29",
        "dst_port": 1723,
        "ei": 32,
        "event": "session.network",
        "login": "root",
        "namespace": "default",
        "pid": 15412,
        "program": "nmap",
        "server_id": "00000000-0000-0000-0000-000000100002",
        "sid": "00000000-0000-0000-0000-000000100008",
        "src_addr": "172.31.9.159",
        "time": "2020-08-18T17:37:35.883Z",
