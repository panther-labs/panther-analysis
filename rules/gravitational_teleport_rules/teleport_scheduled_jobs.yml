AnalysisType: rule
Filename: teleport_scheduled_jobs.py
RuleID: "Teleport.ScheduledJobs"
DisplayName: "Teleport Scheduled Jobs"
Enabled: true
LogTypes:
  - Gravitational.TeleportAudit
Tags:
  - SSH
  - Execution:Scheduled Task/Job
Severity: Medium
Reports:
  MITRE ATT&CK:
    - TA0002:T1053
Description: A user has manually edited the Linux crontab
Threshold: 10
DedupPeriodMinutes: 15
Reference: https://goteleport.com/docs/management/admin/
Runbook: Validate the user behavior and rotate the host if necessary.
SummaryAttributes:
  - event
  - code
  - user
  - program
  - path
  - return_code
  - login
  - server_id
  - sid
Tests:
  - Name: Crontab no args
    ExpectedResult: true
    Log:
      {
        "argv": [],
        "cgroup_id": 4294967717,
        "code": "T4000I",
        "ei": 39,
        "event": "session.command",
        "login": "root",
        "namespace": "default",
        "path": "/bin/crontab",
        "pid": 18415,
        "ppid": 18413,
        "program": "crontab",
        "return_code": 0,
        "server_id": "00000000-0000-0000-0000-000000100012",
        "sid": "00000000-0000-0000-0000-000000100013",
        "time": "2020-08-18T00:05:12.465Z",
        "uid": "00000000-0000-0000-0000-000000100014",
        "user": "panther",
      }
  - Name: Crontab Edit
    ExpectedResult: true
    Log:
      {
        "argv": ["-e"],
        "cgroup_id": 4294967582,
        "code": "T4000I",
        "ei": 50,
        "event": "session.command",
        "login": "root",
        "namespace": "default",
        "path": "/bin/crontab",
        "pid": 9451,
        "ppid": 9217,
        "program": "crontab",
        "return_code": 0,
        "server_id": "00000000-0000-0000-0000-000000100002",
        "sid": "00000000-0000-0000-0000-000000100015",
        "time": "2020-08-17T18:54:32.273Z",
        "uid": "00000000-0000-0000-0000-000000100016",
        "user": "panther",
      }
  - Name: Crontab List
    ExpectedResult: false
    Log:
      {
        "argv": ["-l"],
        "cgroup_id": 4294967582,
        "code": "T4000I",
        "ei": 37,
        "event": "session.command",
        "login": "root",
        "namespace": "default",
        "path": "/bin/crontab",
        "pid": 9330,
        "ppid": 9315,
        "program": "crontab",
        "return_code": 0,
        "server_id": "00000000-0000-0000-0000-000000100002",
        "sid": "00000000-0000-0000-0000-000000100015",
        "time": "2020-08-17T18:50:39.1Z",
        "uid": "00000000-0000-0000-0000-000000100017",
        "user": "panther",
      }
  - Name: Echo command
    ExpectedResult: false
    Log:
      {
        "argv": [],
        "cgroup_id": 4294967537,
        "code": "T4000I",
        "ei": 15,
        "event": "session.command",
        "login": "root",
        "namespace": "default",
        "path": "/bin/echo",
        "pid": 7143,
        "ppid": 7115,
        "program": "echo",
        "return_code": 0,
        "server_id": "00000000-0000-0000-0000-000000100002",
        "sid": "00000000-0000-0000-0000-000000100003",
        "time": "2020-08-17T17:40:37.491Z",
        "uid": "00000000-0000-0000-0000-000000100004",
        "user": "panther",
      }
