AnalysisType: rule
Filename: teleport_auth_errors.py
RuleID: "Teleport.AuthErrors"
DisplayName: "Teleport SSH Auth Errors"
Enabled: true
LogTypes:
  - Gravitational.TeleportAudit
Tags:
  - SSH
  - Credential Access:Brute Force
Severity: Medium
Reports:
  MITRE ATT&CK:
    - TA0006:T1110
Description: A high volume of SSH errors could indicate a brute-force attack
Threshold: 10
DedupPeriodMinutes: 15
Reference: https://goteleport.com/docs/management/admin/
Runbook: >
  Check that the user making the failed requests legitimately tried logging in that many times.
SummaryAttributes:
  - event
  - code
  - user
  - program
  - path
  - return_code
  - login
  - server_id
  - sid
Tests:
  - Name: SSH Errors
    ExpectedResult: true
    Log:
      {
        "code": "T3007W",
        "error": 'ssh: principal "jack" not in the set of valid principals for given certificate: ["ec2-user"]',
        "event": "auth",
        "success": false,
        "time": "2020-08-13T18:39:42Z",
        "uid": "00000000-0000-0000-0000-000000100001",
        "user": "panther",
      }
  - Name: Echo command
    ExpectedResult: false
    Log:
      {
        "argv": [],
        "cgroup_id": 4294967537,
        "code": "T4000I",
        "ei": 15,
        "event": "session.command",
        "login": "root",
        "namespace": "default",
        "path": "/bin/echo",
        "pid": 7143,
        "ppid": 7115,
        "program": "echo",
        "return_code": 0,
        "server_id": "00000000-0000-0000-0000-000000100002",
        "sid": "00000000-0000-0000-0000-000000100003",
        "time": "2020-08-17T17:40:37.491Z",
        "uid": "00000000-0000-0000-0000-000000100004",
        "user": "panther",
      }
