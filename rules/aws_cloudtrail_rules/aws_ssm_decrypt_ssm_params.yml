        "eventName": "GetParameter",
        "eventSource": "ssm.amazonaws.com",
        "eventTime": "2025-02-14 19:43:09.000000000",
        "eventType": "AwsApiCall",
        "eventVersion": "1.11",
        "managementEvent": true,
        "readOnly": true,
        "recipientAccountId": "111122223333",
