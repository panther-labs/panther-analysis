    Log:
      awsRegion: us-east-1
      eventCategory: Management
      eventID: 00000000-0000-0000-0000-000000000006
      eventName: DescribeAccount
      eventSource: organizations.amazonaws.com
      eventTime: "2022-11-21 18:06:52"
      eventType: AwsApiCall
      eventVersion: "1.08"
      managementEvent: true
      p_any_aws_account_ids:
        - "123456789123"
      p_any_aws_arns:
        - arn:aws:iam::123456789123:role/TestUser
        - arn:aws:sts::123456789123:assumed-role/TestUser/test_123456789123
      p_any_ip_addresses:
        - 1.1.1.1
      p_any_trace_ids:
        - ASIA_EXAMPLE_0001
      p_any_usernames:
        - TestUser
      p_event_time: "2022-11-21 18:06:52"
