AnalysisType: rule
Filename: aws_lambda_crud.py
RuleID: "AWS.LAMBDA.CRUD"
DisplayName: "Lambda CRUD Actions"
Enabled: false
LogTypes:
  - AWS.CloudTrail
Tags:
  - AWS
  - Security Control
  - Configuration Required
Reports:
  CIS:
    - 3.12
  MITRE ATT&CK:
    - TA0005:T1525
Severity: High
Description: Unauthorized lambda Create, Read, Update, or Delete event occurred.
Runbook: https://docs.aws.amazon.com/lambda/latest/dg/logging-using-cloudtrail.html
Reference: https://docs.aws.amazon.com/lambda/latest/dg/logging-using-cloudtrail.html
SummaryAttributes:
  - eventSource
  - eventName
  - recipientAccountId
  - awsRegion
  - p_any_aws_arns
Tests:
  - Name: Lambda DeleteFunction Unauthorized Account
    ExpectedResult: true
    Log:
      {
        "eventVersion": "1.03",
        "userIdentity":
          {
            "type": "IAMUser",
            "principalId": "A1B2C3D4E5F6G7EXAMPLE",
            "arn": "arn:aws:iam::999999999999:user/myUserName",
            "accountId": "999999999999",
            "accessKeyId": "AKIA_EXAMPLE_0004",
            "userName": "myUserName",
          },
        "eventTime": "2015-03-18T19:04:42Z",
        "eventSource": "lambda.amazonaws.com",
        "eventName": "DeleteFunction",
        "awsRegion": "us-east-1",
        "sourceIPAddress": "127.0.0.1",
        "userAgent": "Python-httplib2/0.8 (gzip)",
        "requestParameters": { "functionName": "basic-node-task" },
        "responseElements": null,
        "requestID": "00000000-0000-0000-0000-000000000121",
        "eventID": "00000000-0000-0000-0000-000000000022",
        "eventType": "AwsApiCall",
        "recipientAccountId": "999999999999",
      }
  - Name: Lambda DeleteFunction Unauthorized User
    ExpectedResult: true
    Log:
      {
        "eventVersion": "1.03",
        "userIdentity":
          {
            "type": "IAMUser",
            "principalId": "A1B2C3D4E5F6G7EXAMPLE",
            "arn": "arn:aws:iam::123456789012:user/myUserName",
            "accountId": "123456789012",
            "accessKeyId": "AKIA_EXAMPLE_0004",
            "userName": "myUserName",
          },
        "eventTime": "2015-03-18T19:04:42Z",
        "eventSource": "lambda.amazonaws.com",
        "eventName": "DeleteFunction",
        "awsRegion": "us-east-1",
        "sourceIPAddress": "127.0.0.1",
        "userAgent": "Python-httplib2/0.8 (gzip)",
        "requestParameters": { "functionName": "basic-node-task" },
        "responseElements": null,
        "requestID": "00000000-0000-0000-0000-000000000121",
        "eventID": "00000000-0000-0000-0000-000000000022",
        "eventType": "AwsApiCall",
        "recipientAccountId": "123456789012",
      }
  - Name: Lambda DeleteFunction Authorized Account
    ExpectedResult: false
    Log:
      {
        "eventVersion": "1.03",
        "userIdentity":
          {
            "type": "IAMUser",
            "principalId": "A1B2C3D4E5F6G7EXAMPLE",
            "arn": "arn:aws:iam::123456789012:user/DeployRole",
            "accountId": "123456789012",
            "accessKeyId": "AKIA_EXAMPLE_0004",
            "userName": "myUserName",
          },
        "eventTime": "2015-03-18T19:04:42Z",
        "eventSource": "lambda.amazonaws.com",
        "eventName": "DeleteFunction",
        "awsRegion": "us-west-1",
        "sourceIPAddress": "127.0.0.1",
        "userAgent": "Python-httplib2/0.8 (gzip)",
        "requestParameters": { "functionName": "basic-node-task" },
        "responseElements": null,
        "requestID": "00000000-0000-0000-0000-000000000121",
        "eventID": "00000000-0000-0000-0000-000000000022",
        "eventType": "AwsApiCall",
        "recipientAccountId": "123456789012",
      }
