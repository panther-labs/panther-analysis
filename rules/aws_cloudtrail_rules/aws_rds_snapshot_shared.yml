AnalysisType: rule
Filename: aws_rds_snapshot_shared.py
RuleID: "AWS.RDS.SnapshotShared"
DisplayName: "AWS RDS Snapshot Shared"
Enabled: true
LogTypes:
  - AWS.CloudTrail
Tags:
  - AWS
  - Exfiltration
  - Transfer Data to Cloud Account
Severity: High
Reports:
  MITRE ATT&CK:
    - TA0010:T1537
  Stratus Red Team:
    - aws.exfiltration.rds-share-snapshot
Description: >
  An RDS snapshot was shared with another account. This could be an indicator of exfiltration.
Runbook: >
  Ensure that the snapshot was shared intentionally and with an approved account. If not, remove the snapshot and quarantine the compromised IAM user.
Reference: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ShareSnapshot.html
SummaryAttributes:
  - eventSource
  - recipientAccountId
  - awsRegion
  - p_any_aws_arns
Tests:
  - Name: Snapshot shared with another account
    ExpectedResult: true
    Log:
      {
        "eventVersion": "1.08",
        "userIdentity":
          {
            "type": "AssumedRole",
            "principalId": "AROA_EXAMPLE_0006:fake.user",
            "arn": "arn:aws:sts::123456789012:assumed-role/AWSReservedSSO_DevAdmin_0000000000000000/fake.user",
            "accountId": "123456789012",
            "accessKeyId": "ASIA_EXAMPLE_0022",
            "sessionContext":
              {
                "sessionIssuer":
                  {
                    "type": "Role",
                    "principalId": "AROA_EXAMPLE_0006",
                    "arn": "arn:aws:iam::123456789012:role/aws-reserved/sso.amazonaws.com/us-west-2/AWSReservedSSO_DevAdmin_0000000000000000",
                    "accountId": "123456789012",
                    "userName": "AWSReservedSSO_DevAdmin_0000000000000000",
                  },
                "webIdFederationData": {},
                "attributes":
                  {
                    "creationDate": "2023-12-12T19:43:57Z",
                    "mfaAuthenticated": "false",
                  },
              },
          },
        "eventTime": "2023-12-12T20:12:22Z",
        "eventSource": "rds.amazonaws.com",
        "eventName": "ModifyDBSnapshotAttribute",
        "awsRegion": "us-west-2",
        "sourceIPAddress": "198.51.100.150",
        "userAgent": "00000000-0000-0000-0000-000000000077",
        "requestParameters":
          {
            "dBSnapshotIdentifier": "exfiltration",
            "attributeName": "restore",
            "valuesToAdd": ["444444444444"],
          },
        "responseElements":
