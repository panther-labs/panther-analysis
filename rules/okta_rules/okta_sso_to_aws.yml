AnalysisType: rule
Filename: okta_sso_to_aws.py
RuleID: "Okta.SSO.to.AWS"
DisplayName: "SIGNAL - Okta SSO to AWS"
Enabled: true
CreateAlert: false
LogTypes:
    - Okta.SystemLog
Severity: Info
DedupPeriodMinutes: 60
Threshold: 1
Tests:
    - Name: AWS SSO via Okta
      ExpectedResult: true
      Log:
        displayMessage: User single sign on to app
        eventType: user.authentication.sso
        legacyEventType: app.auth.sso
        outcome:
            result: SUCCESS
        securityContext: {}
        severity: INFO
        target:
            - alternateId: AWS Production
              detailEntry:
                signOnModeType: SAML_2_0
              displayName: AWS IAM Identity Center
              id: EXAMPLE_OKTA_APP_03
              type: AppInstance
            - alternateId: aardvark
              displayName: aardvark
              id: 0ua8aardvarkD697
              type: AppUser
        transaction:
            detail: {}
            id: 00000000000000000000000000000033
            type: WEB
        uuid: 00000000-0000-0000-0000-000000000029
        version: "0"
    - Name: AWS SSO via Okta without app name
      ExpectedResult: false
      Log:
        displayMessage: User single sign on to app
        eventType: user.authentication.sso
        legacyEventType: app.auth.sso
        outcome:
            result: SUCCESS
        securityContext: {}
        severity: INFO
        target:
            - alternateId: aardvark
              id: 0ua8aardvarkD697
              type: AppUser
        transaction:
            detail: {}
            id: 00000000000000000000000000000033
            type: WEB
        uuid: 00000000-0000-0000-0000-000000000029
        version: "0"
